name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p ./

      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: Icon assets present
        run: |
          for f in media/icon.png media/pi-light.svg media/pi-dark.svg; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done

      - name: Tests
        run: npm test

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package vsix
        run: npx vsce package --no-dependencies

      - name: Verify vsix contents
        run: |
          vsix=$(ls -1 *.vsix | head -1)
          echo "package: $vsix"
          unzip -l "$vsix"
          # The runtime must be inside; sources and tests must not be.
          unzip -l "$vsix" | grep -q 'extension/out/extension.js' || { echo "out/extension.js missing"; exit 1; }
          unzip -l "$vsix" | grep -q 'extension/media/pi-dark.svg'  || { echo "icon missing"; exit 1; }
          if unzip -l "$vsix" | grep -qE 'extension/(src|test|\.github)/'; then
            echo "sources, tests or CI leaked into the package"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
